name: Build Rockchip low-latency FFmpeg

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: rockchip-low-latency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }} low-latency
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 150

    strategy:
      fail-fast: false
      matrix:
        target:
          - rk3588
          - rk3576
          - rv1126b

    steps:
      - name: Checkout FFmpeg
        uses: actions/checkout@v5

      - name: Resolve target metadata
        id: target
        run: build/rockchip/target-info.sh "${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Resolve Rockchip dependency revisions
        id: rockchip_deps
        run: build/rockchip/resolve-dependencies.sh "${{ matrix.target }}" >> "$GITHUB_OUTPUT"

      - name: Restore Rockchip dependency cache
        id: rockchip_deps_cache
        uses: actions/cache/restore@v5
        with:
          path: .rockchip-cache/deps/${{ matrix.target }}/${{ steps.rockchip_deps.outputs.cache_key }}
          key: rockchip-deps-ubuntu-22.04-arm-${{ matrix.target }}-${{ steps.rockchip_deps.outputs.cache_key }}

      - name: Restore compiler cache
        id: ccache_cache
        uses: actions/cache/restore@v5
        with:
          path: .rockchip-cache/ccache/${{ matrix.target }}
          key: ccache-ubuntu-22.04-arm-${{ matrix.target }}-${{ steps.rockchip_deps.outputs.ccache_cache_version }}-${{ steps.rockchip_deps.outputs.ccache_period }}
          restore-keys: |
            ccache-ubuntu-22.04-arm-${{ matrix.target }}-${{ steps.rockchip_deps.outputs.ccache_cache_version }}-

      - name: Build FFmpeg package in Ubuntu 22.04 ARM64
        env:
          MPP_SHA: ${{ steps.rockchip_deps.outputs.mpp_sha }}
          RGA_SHA: ${{ steps.rockchip_deps.outputs.rga_sha }}
        run: ./build-rockchip.sh "${{ matrix.target }}"

      - name: Save Rockchip dependency cache
        if: steps.rockchip_deps_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .rockchip-cache/deps/${{ matrix.target }}/${{ steps.rockchip_deps.outputs.cache_key }}
          key: ${{ steps.rockchip_deps_cache.outputs.cache-primary-key }}

      - name: Save compiler cache
        if: always() && steps.ccache_cache.outcome == 'success' && steps.ccache_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .rockchip-cache/ccache/${{ matrix.target }}
          key: ${{ steps.ccache_cache.outputs.cache-primary-key }}

      - name: Upload FFmpeg package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.target.outputs.artifact }}
          path: ${{ steps.target.outputs.package_path }}
          if-no-files-found: error

      - name: Upload configure log on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ffmpeg-config-log-${{ matrix.target }}
          path: .build/rockchip/${{ matrix.target }}/ffmpeg/ffbuild/config.log
          if-no-files-found: ignore
